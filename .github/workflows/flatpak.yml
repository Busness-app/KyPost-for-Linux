# Flatpak build + self-hosted update channel.
#
# --- Why this exists separately from ci.yml ---
#
# KyPost will never ship on Flathub: Flathub bans applications that use AI,
# and KyPost's backend does (the Ollama-backed classifier). That is a policy
# ban, not a packaging gap, so no amount of manifest compliance changes it.
# This workflow therefore *is* the distribution channel, not a rehearsal for
# one -- it publishes a signed OSTree repository to the gh-pages branch so
# users get working `flatpak update`, rather than a one-shot .flatpak bundle
# that installs once and then rots. See docs/DISTRIBUTION.md.
#
# The single-file bundle is still produced, as a PR artifact and as a
# tagged-release download for people who don't want to add a remote.
#
# --- Why a gh-pages branch rather than actions/deploy-pages ---
#
# An OSTree repo must *accumulate*: `flatpak update` computes a delta from
# the commit the user already has, so previous commits have to stay
# reachable. The artifact-based Pages deploy replaces the published site
# wholesale each run, which would strand every existing install on a repo
# whose history had vanished. So each run clones the currently-published
# repo, exports the new build *into* it, and force-pushes the result back as
# a single orphan commit -- OSTree keeps its own history inside the repo,
# while git history stays one commit deep so the branch doesn't grow without
# bound as pruned objects pile up.
#
# --- Why two jobs ---
#
# The app is published for x86_64 and aarch64 (Plasma Mobile is a target, so
# arm64 is not optional). Each arch builds on its own native runner --
# GitHub's ubuntu-24.04-arm is free for public repos, and qemu emulation
# would put an hour on a QtWebEngine build and make the smoke test
# meaningless.
#
# Two matrix jobs cannot both force-push gh-pages; the workflow-level
# concurrency group serialises whole runs, not jobs within one. So the
# matrix only builds, into a per-arch unsigned OSTree repo it hands over as
# an artifact, and a single `publish` job merges both into the published
# repo and pushes once.
#
# That split also keeps the signing key out of the matrix entirely: build
# jobs never see it. Commits are signed on the way into the published repo
# by `flatpak build-commit-from --gpg-sign`, which is what a client with
# gpg-verify actually checks -- a signed summary alone would not be enough.
#
# --- Size ---
#
# GitHub Pages caps a published site at 1 GB. The runtime is NOT in here
# (users get org.kde.Platform//6.11 from Flathub); this repo holds only
# KyPost plus its three from-source modules -- now for two architectures.
# The .Debug refs are deliberately NOT published (see the merge step), which
# is what keeps two arches from costing much more than one did. --prune-depth
# below bounds growth; if the site ever approaches the cap, lower it.

name: Flatpak

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * *" # nightly, matches ci.yml's off-peak slot

# Two publishing runs must never race the gh-pages force-push, so every
# publishing run shares one group and is never cancelled mid-flight (a
# half-finished publish is worse than a queued one). PR builds publish
# nothing, so they get a per-ref group instead -- otherwise a slow PR build
# would sit in front of a release.
concurrency:
  group: >-
    ${{ github.event_name == 'pull_request'
        && format('flatpak-pr-{0}', github.ref)
        || 'flatpak-publish' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write # push the gh-pages branch; attach tagged-release assets

env:
  APP_ID: com.kysecurity.mail
  MANIFEST: packaging/flatpak/com.kysecurity.mail.yaml
  PAGES_URL: https://yoshiofthewire.github.io/KyPost-for-Linux

jobs:
  build:
    strategy:
      # One arch failing should not hide whether the other is also broken.
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runs_on: ubuntu-24.04
          - arch: aarch64
            runs_on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs_on }}
    steps:
      - uses: actions/checkout@v4

      # First, because a tagged run that gets this wrong publishes a signed
      # build claiming the wrong version to everyone on the remote, and the
      # OSTree repo is append-only -- there is no unpublishing it.

      - name: Verify version consistency
        run: ./scripts/verify-version.sh

      # Publishing needs the signing key, which pull_request events from
      # forks never get. Those runs still build and smoke-test; they just
      # produce an unsigned local repo and a bundle artifact.

      - name: Install flatpak tooling
        run: |
          sudo apt-get update
          # elfutils supplies eu-strip and eu-elfcompress. flatpak-builder
          # separates debug info out of every module it builds into a
          # .Debug extension, and shells out to eu-strip to do it -- without
          # it the build dies at the FIRST module that produces a shared
          # library ("Failed to execute child process eu-strip"), which is
          # qtkeychain, long before anything KyPost-specific is reached.
          # Not pulled in by flatpak-builder's own dependencies, and not
          # present on ubuntu-24.04 runners by default.
          # librsvg2-common supplies gdk-pixbuf's SVG loader
          # (libpixbufloader-svg.so), and without it this job could never
          # succeed -- it failed 36/36 runs from 2026-07-26 for exactly this.
          #
          # flatpak-builder runs `appstreamcli compose` at export. ubuntu-24.04
          # ships appstream 1.0.2, which decodes images through gdk-pixbuf;
          # gdk-pixbuf cannot read SVG at all unless librsvg's loader is
          # installed, and `appstream` does not depend on it. So compose hit
          # the app's scalable icon and reported:
          #
          #   E: file-read-error
          #      Unable to read data from file
          #      `//share/icons/hicolor/scalable/apps/com.kysecurity.mail.svg`:
          #      Unrecognized image file format
          #
          # ...followed by `filters-but-no-output`, because the component was
          # then dropped and the --components filter matched nothing. Neither
          # message names the icon: flatpak-builder invokes compose without
          # --print-report, so for a month the log showed only the issue names.
          # The "Diagnose appstreamcli compose failure" step below is what
          # surfaced the text above, which is why it stays.
          #
          # Verified rather than assumed: gdk-pixbuf WITH librsvg loads this
          # exact file (1024x1024), and appstream 1.1.6 composes it fine
          # because 1.1.x decodes via glycin instead of gdk-pixbuf -- which is
          # why it reproduced locally as a success and only ever failed here.
          sudo apt-get install -y --no-install-recommends \
            flatpak flatpak-builder ostree appstream desktop-file-utils elfutils \
            librsvg2-common dbus-bin
          # Added to both installations deliberately: flatpak-builder runs
          # with --user below, but the pre-existing system-wide remote is
          # what the nightly job has been resolving --install-deps-from
          # against since 2026-07-17. Keep both so neither path regresses.
          sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo

      # Cheap, and it runs before the multi-minute build so metadata typos
      # fail in seconds. This metadata is the software-centre listing users
      # actually see, which matters more for a self-hosted remote than it
      # would for a store-reviewed one.

      - name: Validate AppStream and desktop metadata
        run: |
          appstreamcli validate --no-net packaging/flatpak/com.kysecurity.mail.metainfo.xml
          desktop-file-validate packaging/flatpak/com.kysecurity.mail.desktop

      # Without this, qtkeychain 0.17.0, zxing-cpp v3.1.0 and kunifiedpush
      # 26.04.3 rebuild from source on every single run.

      - name: Cache flatpak-builder state
        uses: actions/cache@v4
        with:
          path: .flatpak-builder
          key: flatpak-builder-${{ matrix.arch }}-${{ hashFiles('packaging/flatpak/com.kysecurity.mail.yaml') }}-${{ github.run_id }}
          # No bare "flatpak-builder-" fallback: that key is writable by any
          # branch, so a pull request could seed the .flatpak-builder state
          # that a later publishing run builds from.
          restore-keys: |
            flatpak-builder-${{ hashFiles('packaging/flatpak/com.kysecurity.mail.yaml') }}-

      # Unsigned, into a per-arch repo this job hands to `publish`. The key
      # never reaches a matrix job; signing happens once, on the way into the
      # published repo. flatpak-builder resolves org.kde.Platform,
      # org.kde.Sdk and the qtwebengine BaseApp for the runner's own arch --
      # all three are published for aarch64 on Flathub (checked directly).
      - name: Build and export
        run: |
          set -euo pipefail
          mkdir -p "repo-${{ matrix.arch }}"

          flatpak-builder --user --force-clean --install-deps-from=flathub \
            --repo="repo-${{ matrix.arch }}" \
            build-flatpak "$MANIFEST"

      # DIAGNOSTIC, failure-only. This job has never once succeeded (36/36
      # failures since 2026-07-26), always at flatpak-builder's export step
      # with appstreamcli compose reporting:
      #
      #     com.kysecurity.mail
      #       E: file-read-error
      #     general
      #       E: filters-but-no-output
      #
      # Those are issue *names* with no detail, because flatpak-builder
      # invokes compose without --print-report, and the temporary result-root
      # it composes into is gone by the time the step fails. So the actual
      # reason has never been visible in a log.
      #
      # Everything cheap has already been ruled out locally: the metainfo,
      # the .desktop file and all nine icons are installed correctly (the
      # build log shows each one), `appstreamcli validate --no-net` passes as
      # its own step above, and running this exact compose against a staged
      # `cmake --install` tree succeeds and emits both the component XML and
      # the 64/128px icons. The one difference left is the tool: ubuntu-24.04
      # ships appstream 1.0.2, and the local reproduction used 1.1.6.
      #
      # This step re-runs compose on the tree flatpak-builder left behind,
      # with --print-report=full, so a failing run says what is actually
      # wrong instead of merely that something is. It is what identified the
      # missing librsvg2-common above, after a month of logs that named the
      # issue but never its cause. It stays: it is `if: failure()`, so it
      # costs a passing run nothing.
      - name: Diagnose appstreamcli compose failure
        if: failure()
        run: |
          set -x
          appstreamcli --version || true
          echo "--- metadata present in the built tree? ---"
          ls -l build-flatpak/files/share/metainfo/ || true
          ls -l build-flatpak/files/share/applications/ || true
          find build-flatpak/files/share/icons -name 'com.kysecurity.mail.*' -printf '%s\t%p\n' || true
          echo "--- compose, with the report flatpak-builder never asks for ---"
          rm -rf /tmp/ascdiag
          appstreamcli compose \
            --print-report=full \
            --verbose \
            --no-net \
            --prefix=/ \
            --origin="$APP_ID" \
            --components="$APP_ID","$APP_ID".desktop \
            --result-root=/tmp/ascdiag \
            --data-dir=/tmp/ascdiag/xmls \
            --icons-dir=/tmp/ascdiag/icons \
            --hints-dir=/tmp/ascdiag/hints \
            build-flatpak/files || true
          echo "--- generated hint reports ---"
          find /tmp/ascdiag/hints -type f -exec echo '### {}' \; -exec cat {} \; || true

      # Confirms the app actually loads inside the sandbox rather than just
      # that the build succeeded -- catches components missing from
      # app/qml/qml.qrc, which has bitten this repo for real. Runs before the
      # publish step, so a broken build never reaches users.

      - name: Launch smoke test
        run: |
          set -o pipefail
          rc=0
          # dbus-run-session, because this app legitimately requires a session
          # bus and a GitHub runner has none. main.cpp constructs
          # KDBusService(KDBusService::Unique) for duplicate-launch detection
          # and kypost:// activation, KNotifications and KUnifiedPush both
          # need the bus too, and Qt's platform theme calls
          # org.freedesktop.portal.Settings.ReadAll before any of that. With
          # no bus the app exited 1 during startup:
          #
          #   Call to org.freedesktop.portal.Settings.ReadAll failed
          #   QDBusError("org.freedesktop.DBus.Error.Disconnected", ...)
          #   kf.dbusaddons: DBus session bus not found.
          #
          # That is the runner missing a desktop session, not a defect in the
          # app -- every real Plasma/GNOME session has one. Spawning a private
          # bus for the duration is the standard fix and keeps this test
          # measuring what it is meant to measure: whether the QML root and
          # the bundled libraries actually load.
          timeout 15 dbus-run-session -- flatpak-builder --run build-flatpak \
            "$MANIFEST" kypost --platform offscreen > launch.log 2>&1 || rc=$?
          cat launch.log

          # The exit code is the load-bearing check, not the log grep.
          # main.cpp returns -1 (exit 255) when engine.rootObjects() is empty,
          # and a QML root that fails to load can do so while printing
          # NOTHING at all -- verified: an invalid property assignment on a
          # custom component produced exit 255 with a zero-byte log. A
          # grep-only test passes that build happily. 124 is `timeout`
          # killing a still-running app, which is the success case here.
          if [ "$rc" -ne 124 ]; then
            echo "App exited with $rc instead of staying up (124 = timeout killed it, i.e. healthy)." >&2
            echo "Exit 255 usually means the QML root failed to load." >&2
            exit 1
          fi

          if grep -qi "is not a type\|unavailable\|QQmlApplicationEngine failed" launch.log; then
            echo "QML load failure detected in launch output" >&2
            exit 1
          fi

      # Generated rather than committed so the embedded public key can never
      # drift out of sync with the key the repo was actually signed with.

      # Unsigned bundle, so pull requests and fork builds -- which have no key
      # by design -- still produce something a human can download and install.
      # Tagged releases get these rebuilt and signed in the publish job.
      - name: Build unsigned bundle
        run: |
          set -euo pipefail
          # --runtime-repo lets a bundle install pull org.kde.Platform itself.
          flatpak build-bundle --arch="${{ matrix.arch }}" \
            "repo-${{ matrix.arch }}" "kypost-${{ matrix.arch }}.flatpak" "$APP_ID" \
            --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: kypost-flatpak-${{ matrix.arch }}-${{ github.sha }}
          path: kypost-${{ matrix.arch }}.flatpak
          if-no-files-found: error

      # tar, then compression-level 0: an archive-z2 OSTree repo is already
      # zlib-compressed per object, and it is thousands of small files --
      # letting upload-artifact zip them again costs minutes and saves
      # nothing. tar also preserves the layout ostree needs on the far side.
      - name: Pack OSTree repo for the publish job
        run: tar -cf "repo-${{ matrix.arch }}.tar" "repo-${{ matrix.arch }}"

      - name: Upload OSTree repo artifact
        uses: actions/upload-artifact@v4
        with:
          name: repo-${{ matrix.arch }}-${{ github.sha }}
          path: repo-${{ matrix.arch }}.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  publish:
    needs: build
    # Pull requests never publish (no secrets on forks) and the matrix has
    # already built and smoke-tested them, so there is nothing left to do.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # First, because a tagged run that gets this wrong publishes a signed
      # build claiming the wrong version to everyone on the remote, and the
      # OSTree repo is append-only -- there is no unpublishing it.

      - name: Decide whether this run publishes
        id: mode
        env:
          HAS_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY != '' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ] && [ "$HAS_KEY" = "true" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            if [ "$EVENT_NAME" != "pull_request" ]; then
              echo "::warning::FLATPAK_GPG_PRIVATE_KEY is not set - building only, not publishing. See docs/DISTRIBUTION.md."
            fi
          fi

      # Only what merging and serving a repo needs -- this job builds nothing,
      # so flatpak-builder, appstream and the SDK are all absent here.
      - name: Install flatpak and ostree
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak ostree

      - name: Download per-arch OSTree repos
        uses: actions/download-artifact@v4
        with:
          pattern: repo-*-${{ github.sha }}
          merge-multiple: true

      # The unsigned bundles the matrix already built. On a tag with a signing
      # key these get overwritten by signed ones below; without a key they are
      # what the release gets, which keeps "a tag always ships a bundle" true
      # rather than failing the attach step on a missing file.
      - name: Download per-arch bundles
        uses: actions/download-artifact@v4
        with:
          pattern: kypost-flatpak-*-${{ github.sha }}
          merge-multiple: true

      - name: Unpack per-arch OSTree repos
        run: |
          set -euo pipefail
          for arch in x86_64 aarch64; do
            tar -xf "repo-$arch.tar"
            echo "$arch refs:"
            ostree --repo="repo-$arch" refs | sed 's/^/  /'
          done

      - name: Import signing key
        if: steps.mode.outputs.publish == 'true'
        env:
          GPG_PRIVATE_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
        run: |
          GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -p "$GNUPGHOME"
          chmod 700 "$GNUPGHOME"
          printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --homedir "$GNUPGHOME" --batch --import
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"

      # Clone the currently-published repo so the new commit lands on top of
      # the existing OSTree history (see the header comment). .git is
      # discarded because the publish step re-inits an orphan commit.

      - name: Restore published OSTree repo
        if: steps.mode.outputs.publish == 'true'
        run: |
          if git clone --depth 1 --branch gh-pages \
              "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" _site; then
            rm -rf _site/.git
            echo "Restored existing published repo."
          else
            rm -rf _site
            mkdir -p _site
            echo "No gh-pages branch yet - starting a fresh repo."
          fi

          # git cannot represent an empty directory, so every OSTree scratch
          # directory that happened to be empty at publish time is missing
          # from the clone. This is not cosmetic: verified locally that
          # without this, the *second* publish onto a restored repo dies with
          #   error: Listing refs: opendir(refs/remotes): No such file or directory
          # i.e. the very first update would have been the one that broke.
          # The exact set git drops from a freshly-built repo is
          # extensions/, state/, tmp/, tmp/cache/, refs/mirrors/,
          # refs/remotes/ -- recreate all of them plus refs/heads/.
          if [ -d _site/repo ]; then
            mkdir -p _site/repo/tmp/cache _site/repo/state _site/repo/extensions \
                     _site/repo/refs/heads _site/repo/refs/mirrors _site/repo/refs/remotes
            ostree --repo=_site/repo fsck --quiet \
              || echo "::warning::Restored OSTree repo failed fsck; continuing (build-update-repo may repair it)."
          fi

      # Both arches into the one published repo, signed as they land.
      #
      # build-commit-from rather than `ostree pull-local`: pull-local copies
      # commits verbatim, so unsigned build output would stay unsigned, and a
      # client configured with GPGKey= verifies the *commit*, not just the
      # summary -- it would refuse the install. Verified locally end to end:
      # merged repo, both arches, every app/ and runtime/ ref carrying a
      # signature, a client importing the public key resolving both arches,
      # and a client importing a different key correctly refused.
      #
      # The appstream branches transfer along with app/; the .Debug refs do
      # not. Debuginfo is the single largest thing this repo could carry and
      # there are now two copies of it, one per arch, against a 1 GB Pages
      # cap. It is dropped here rather than with flatpak-builder's
      # --disable-debuginfo so that the app ref stays *stripped* -- builder
      # separates debug info out of the binaries as part of producing that
      # ref, and turning the whole mechanism off risks shipping fat binaries
      # instead. Filtering after the fact cannot affect the app ref at all.
      #
      # Refs are arch-qualified, so the two sources cannot collide.
      #
      # Deleting the already-published .Debug refs is what actually reclaims
      # the space -- skipping the new ones only stops it growing, while the
      # old refs keep their objects alive against --prune forever. Measured
      # on a synthetic repo: 20M -> 272K, fsck clean. The loop is a no-op
      # once they are gone, which is every run after the first.
      #
      # `ostree init` first because on the very first publish there is no
      # gh-pages branch to restore and build-commit-from does not create a
      # repo -- it fails with `opendir(objects): No such file or directory`.
      # It is a no-op against the restored repo on every later run.
      - name: Merge both architectures into the published repo
        if: steps.mode.outputs.publish == 'true'
        env:
          GPG_KEY_ID: ${{ secrets.FLATPAK_GPG_KEY_ID }}
        run: |
          set -euo pipefail
          mkdir -p _site/repo
          ostree --repo=_site/repo init --mode=archive-z2

          # Retire debuginfo published before this was turned off.
          for ref in $(ostree --repo=_site/repo refs | grep '\.Debug/' || true); do
            ostree --repo=_site/repo refs --delete "$ref"
            echo "retired $ref"
          done

          for arch in x86_64 aarch64; do
            # `case`, not `grep -v`: a grep that filters every line exits 1,
            # and inside $(...) that yields an empty list rather than an
            # error -- the arch would silently not be published.
            for ref in $(ostree --repo="repo-$arch" refs); do
              case "$ref" in
                *.Debug/*)
                  echo "skipped $ref (debuginfo is not published)"
                  continue
                  ;;
              esac
              flatpak build-commit-from \
                --src-repo="repo-$arch" \
                --gpg-sign="$GPG_KEY_ID" --gpg-homedir="$GNUPGHOME" \
                --no-update-summary \
                _site/repo "$ref"
              echo "committed $ref"
            done
          done

          # --generate-static-deltas is what makes `flatpak update` download a
          # diff instead of the whole app. --prune-depth bounds how many old
          # commits stay resolvable, which is the site-size control knob.
          flatpak build-update-repo \
            --title="KyPost" \
            --generate-static-deltas \
            --prune --prune-depth=3 \
            --gpg-sign="$GPG_KEY_ID" --gpg-homedir="$GNUPGHOME" \
            _site/repo

      # Only tags need a bundle to attach, and only a signed one is worth
      # attaching. Every other run already uploaded the unsigned per-arch
      # bundles as artifacts from the build job.
      - name: Build signed bundles
        if: steps.mode.outputs.publish == 'true' && startsWith(github.ref, 'refs/tags/v')
        env:
          GPG_KEY_ID: ${{ secrets.FLATPAK_GPG_KEY_ID }}
        run: |
          set -euo pipefail
          for arch in x86_64 aarch64; do
            flatpak build-bundle --arch="$arch" \
              _site/repo "kypost-$arch.flatpak" "$APP_ID" \
              --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo \
              --gpg-sign="$GPG_KEY_ID" --gpg-homedir="$GNUPGHOME"
          done

      - name: Generate .flatpakrepo and landing page
        if: steps.mode.outputs.publish == 'true'
        env:
          GPG_KEY_ID: ${{ secrets.FLATPAK_GPG_KEY_ID }}
        run: |
          set -euo pipefail
          gpg --homedir "$GNUPGHOME" --export "$GPG_KEY_ID" > _site/kypost.gpg

          {
            echo "[Flatpak Repo]"
            echo "Title=KyPost"
            echo "Url=$PAGES_URL/repo/"
            echo "Homepage=https://github.com/${{ github.repository }}"
            echo "Comment=Relay-based email client for KDE Plasma and Plasma Mobile"
            echo "Description=Official self-hosted Flatpak channel for KyPost."
            echo "GPGKey=$(base64 -w0 < _site/kypost.gpg)"
          } > _site/kypost.flatpakrepo

          sed "s|@PAGES_URL@|$PAGES_URL|g; s|@REPOSITORY@|${{ github.repository }}|g" \
            packaging/flatpak/site/index.html.in > _site/index.html

          # GitHub Pages runs Jekyll by default, which skips files and
          # directories it considers special. An OSTree repo must be served
          # byte-for-byte, so opt out entirely.
          touch _site/.nojekyll

      - name: Publish OSTree repo to gh-pages
        if: steps.mode.outputs.publish == 'true'
        run: |
          set -euo pipefail
          cd _site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Publish ${{ github.sha }}"
          git push -f \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" \
            gh-pages
          echo "Published to $PAGES_URL"
          du -sh . | awk '{print "Published site size: " $1 " (GitHub Pages caps at 1 GB)"}'

      # The signing key is the entire integrity story for a self-distributed
      # OSTree repo -- passphraseless and non-expiring by design, with no
      # Flathub review layer behind it -- so it must not still be on disk when
      # third-party action code runs. Destroyed here rather than left for the
      # runner to reap.

      - name: Destroy signing key material
        if: always()
        run: |
          if [ -n "${GNUPGHOME:-}" ] && [ -d "$GNUPGHOME" ]; then
            rm -rf "$GNUPGHOME"
          fi
          echo "GNUPGHOME=" >> "$GITHUB_ENV"

      - name: Attach bundles to release
        if: startsWith(github.ref, 'refs/tags/v')
        # Pinned to a commit, not the mutable v2 tag: a third-party action
        # repointed at malicious code runs with this repo's secrets in scope.
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631 # v2.2.2
        with:
          files: kypost-*.flatpak
          fail_on_unmatched_files: true
