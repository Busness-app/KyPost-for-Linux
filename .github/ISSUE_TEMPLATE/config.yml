      Mail not being fetched or labelled, pairing codes refused, IMAP or SMTP
      errors, TLS and reverse-proxy setup — those live in the server, not here.
  - name: Setup and configuration questions
    url: https://github.com/Busness-app/KyPost-for-Linux/blob/main/README.md
    about: Check the README first — most first-run problems are covered there.
